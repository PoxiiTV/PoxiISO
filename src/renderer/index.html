<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoxiISO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="brand"><img src="icon.png" alt=""><span>Poxi<em>ISO</em></span><small data-i18n="badge.admin"></small></div>
      <div class="wc">
        <button id="min" data-i18n-label="win.min"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button id="max" data-i18n-label="win.max"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button id="close" class="close" data-i18n-label="win.close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <aside class="side">
      <div class="group" data-i18n="nav.group.install"></div>
      <nav>
        <button class="nav active" type="button" data-section="install" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span data-i18n="nav.install"></span>
        </button>
        <button class="nav" type="button" data-section="isos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span data-i18n="nav.isos"></span>
        </button>
      </nav>
      <div class="group" data-i18n="nav.group.more"></div>
      <nav>
        <button class="nav" type="button" data-section="boot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6"/></svg>
          <span data-i18n="nav.plugson"></span>
        </button>
        <button class="nav" type="button" data-section="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
          <span data-i18n="nav.settings"></span>
        </button>
      </nav>
    </aside>
    <main><div id="view" aria-live="polite"></div></main>
  </div>
  <script src="ui.js"></script>
  <script src="isos.js"></script>
  <script src="preview.js"></script>
  <script src="boot.js"></script>
  <script src="downloads.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
